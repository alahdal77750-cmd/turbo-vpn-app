workflows:
  flutter-apk-build:
    name: Build Flutter Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Set up Flutter and Get Packages
        script: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$TARGET_DIR"
          flutter packages get
      - name: Build Android APK
        script: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$TARGET_DIR"
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
      
